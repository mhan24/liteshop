name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 集成测试需要真实 PostgreSQL（连接串与 vitest.config.ts 一致）
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: liteshop-test
          POSTGRES_DB: liteshop_test
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liteshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # next build 以 NODE_ENV=production 运行，env 校验会（正确地）拒绝 mock 驱动；
      # 测试的 PAYMENT_DRIVER=mock 由 vitest.config.ts 注入。
      PAYMENT_DRIVER: auto
      AUTH_SECRET: ci-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 部署脚本是上线路径的一部分：语法错误应在 CI 暴露
      - name: Shell checks
        run: |
          set -euo pipefail
          bash -n scripts/deploy.sh
          for f in ops/*.sh; do sh -n "$f"; done
          # 变量名后紧跟全角字符会被 bash 并入变量名（$SHA（ → 变量 "SHA（"）
          if grep -nE '\$[A-Za-z_][A-Za-z0-9_]*[（），。：；、！？]' scripts/deploy.sh ops/*.sh; then
            echo "::error::变量名后紧跟全角字符，请改用 \${VAR} 形式"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error -e SC1090,SC1091 scripts/deploy.sh ops/*.sh

      # Caddyfile 用官方镜像解析（域名来自环境变量，缺失或语法错误都会在这里失败）
      - name: Caddyfile check
        run: |
          docker run --rm -e DOMAIN=shop.example.com -e PAY_DOMAIN=pay.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

  # 测试全部通过后，在原生 arm64 机器上构建生产镜像并推送到 GHCR（标签 = 提交号）。
  # 只构建、不部署：部署仍由 scripts/deploy.sh 在用户明确指令下执行（见 AGENTS.md）。
  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: SITE_URL=https://shop.9527.tr
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
