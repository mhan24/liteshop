name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: internal/web/admin-ui
          retention-days: 1

  go:
    name: Go (vet / build / test)
    needs: admin-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download admin bundle
        uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: internal/web/admin-ui

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build linux binary (arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o shop-linux-arm64 ./cmd/shop
        shell: bash

      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: shop-linux-arm64
          path: shop-linux-arm64

  storefront:
    name: Storefront build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
