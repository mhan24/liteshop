name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 注意：不要在这里设 PAYMENT_DRIVER=mock。
      # next build 会以 NODE_ENV=production 收集页面数据，
      # 此时 assertProductionSafety() 会（正确地）拒绝 mock 驱动。
      PAYMENT_DRIVER: auto
      AUTH_SECRET: ci-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # better-sqlite3 为原生模块，需要构建链
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      # 测试需要 mock 渠道来跑通「下单 → 回调 → 发货」全链路；
      # vitest.config.ts 也会设置 PAYMENT_DRIVER=mock（此处显式重申）
      - name: Test
        run: npm test
        env:
          PAYMENT_DRIVER: mock

      - name: Build
        run: npm run build
