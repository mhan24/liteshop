name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建前台（Nuxt SSR）
        working-directory: web/storefront
        run: |
          npm ci
          npm run build

      - name: 构建后台（Vite 生产构建）
        working-directory: web/admin
        run: |
          npm ci
          npm run build

      - name: 构建后端二进制
        run: |
          tag="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -tags production -trimpath \
            -ldflags "-s -w \
              -X shop/internal/platform/version.Version=${tag} \
              -X shop/internal/platform/version.Commit=${GITHUB_SHA::8} \
              -X shop/internal/platform/version.Date=$(date -u +%Y-%m-%d)" \
            -o dist/liteshop ./cmd/liteshop

      - name: 生成版本信息
        run: |
          tag="${GITHUB_REF_NAME#v}"
          printf 'liteshop %s\ncommit %s\nbuilt %s\n' \
            "${tag}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/version.txt

      - name: 打包部署文件
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist/storefront dist/admin dist/migrations
          cp -R web/storefront/.output/. dist/storefront/
          cp -R web/admin/dist/. dist/admin/
          cp migrations/*.sql dist/migrations/
          tar -czf dist/liteshop-${tag}.tgz -C dist \
            liteshop version.txt storefront admin migrations
          cd dist
          sha256sum liteshop-${tag}.tgz > liteshop-${tag}.tgz.sha256
          sha256sum liteshop > liteshop.sha256

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            dist/liteshop-${tag#v}.tgz \
            dist/liteshop-${tag#v}.tgz.sha256 \
            --title "${tag}" \
            --generate-notes
