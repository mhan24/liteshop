# LiteShop Docker 部署
#
# 快速开始:
#   1. cp .env.example .env && 按需修改 (DOMAIN 必填)
#   2. docker compose up -d --build
#   3. 打开 https://<DOMAIN>/setup 完成初始化
#
# 服务:
#   liteshop     - Go API + 内嵌后台 (8080)
#   storefront   - Nuxt SSR 前台 (3000)
#   caddy        - 反向代理 + 自动 HTTPS (80/443)
#   sqlite       - 数据存于命名卷 liteshop_data

services:
  liteshop:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: shop
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: liteshop/shop:${TAG:-latest}
    container_name: liteshop
    restart: unless-stopped
    environment:
      SHOP_LISTEN_ADDR: ":8080"
      SHOP_DATABASE_PATH: /app/data/shop.db
      SHOP_PUBLIC_BASE_URL: ${SHOP_PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}}
      BEPUSDT_NOTIFY_URL: ${BEPUSDT_NOTIFY_URL:-https://${DOMAIN:-localhost}/notify/bepusdt}
    volumes:
      - liteshop_data:/app/data
    networks:
      - liteshop-net

  storefront:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: storefront
    image: liteshop/storefront:${TAG:-latest}
    container_name: liteshop-storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - liteshop
    networks:
      - liteshop-net

  caddy:
    image: caddy:2-alpine
    container_name: liteshop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - liteshop
      - storefront
    networks:
      - liteshop-net

networks:
  liteshop-net:
    name: liteshop-net

volumes:
  liteshop_data:
  caddy_data:
  caddy_config:
