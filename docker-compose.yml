services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: liteshop:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://liteshop:${POSTGRES_PASSWORD:-liteshop}@db:5432/liteshop
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - edge

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liteshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liteshop}
      POSTGRES_DB: liteshop
    volumes:
      # postgres:18+ 镜像数据目录约定为 /var/lib/postgresql（pg_ctlcluster 兼容布局）
      - pgdata:/var/lib/postgresql
    # 仅内网：不映射端口，数据库无法从宿主机/公网直接访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteshop -d liteshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-liteshop}
      TZ: Asia/Shanghai
    volumes:
      - ./backups:/backups
      - ./ops:/ops:ro
    # 每天备份 + 完整性检查；每周日恢复演练（见 ops/backup.sh）
    entrypoint: ["sh", "/ops/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # 异地备份：把 ./backups 加密上传到 .env.offsite 中 RCLONE_CONFIG_OFFSITE_* 定义的远端（未配置时空转）
  offsite:
    image: rclone/rclone:1
    restart: unless-stopped
    # 只读单独的 .env.offsite（存储凭据），拿不到应用的其它密钥；文件不存在时容器空转
    env_file:
      - path: .env.offsite
        required: false
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./backups:/backups:ro
      - ./ops:/ops:ro
    entrypoint: ["sh", "/ops/offsite.sh"]
    networks:
      - egress

  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: >
      sh -c 'while true; do
        curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/cron/maintenance >/dev/null || echo "[cron] maintenance failed";
        sleep 60;
      done'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 必填：缺失时 compose 在创建任何容器前报错退出（不会带着错误域名申请证书）
      DOMAIN: ${DOMAIN:?请在 .env 设置 DOMAIN（商店域名）}
      PAY_DOMAIN: ${PAY_DOMAIN:-pay.9527.tr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
      # LitePay 网关容器所在网络（pay 站点反代 litepay:3000）
      - litepay

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
  # 只出不进：offsite 访问外部存储用（不与数据库同网）
  egress:
  # LitePay 网关容器（独立部署，不在本 compose 内）所在的网络。
  # external：compose 只负责把 caddy 接进去，不创建也不删除它；
  # 取代原来每次重建 caddy 后手工 docker network connect 的步骤。
  litepay:
    external: true
    name: liteshop_default
