# 可选反向代理（自动 HTTPS）：与主 compose 叠加使用
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
# 需要域名 A/AAAA 记录指向本服务器；Caddyfile 域名来自 .env 的 DOMAIN
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      liteshop:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
