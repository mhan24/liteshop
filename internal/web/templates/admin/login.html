{{define "admin_login"}}
{{template "head" .}}
<main class="container narrow">
  <article class="card">
    <h1>{{t .Lang "admin_login_title"}}</h1>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/login" class="form">
      <label>{{t .Lang "username"}}<input type="text" name="username" required></label>
      <label>{{t .Lang "password"}}<input type="password" name="password" required></label>
      <button class="btn" type="submit">{{t .Lang "login"}}</button>
    </form>
  </article>
</main>
</body>
</html>
{{end}}
