{{define "admin_site"}}
{{template "head" .}}
{{template "admin_nav" .}}
<main class="container narrow">
  <article class="card">
    <h1>{{t .Lang "site_settings"}}</h1>
    <p class="muted">{{t .Lang "save_effect_now"}}</p>
    {{if .Saved}}<div class="ok">{{t .Lang "save"}}</div>{{end}}
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/site" class="form">
      <label>{{t .Lang "site_title"}}
        <input type="text" name="site_title" value="{{.SiteTitle}}" maxlength="80" required>
      </label>
      <label>{{t .Lang "description"}}
        <input type="text" name="site_subtitle" value="{{.SiteSubtitle}}" maxlength="160">
      </label>
      <label>{{t .Lang "description"}}
        <textarea name="site_announcement" rows="6" maxlength="4000">{{.Announcement}}</textarea>
      </label>
      <label>SEO Description
        <textarea name="seo_description" rows="4" maxlength="220">{{.SEODescription}}</textarea>
      </label>
      <label>SEO Keywords
        <input type="text" name="seo_keywords" value="{{.SEOKeywords}}" maxlength="220">
      </label>
      <label>{{t .Lang "contact_info"}}
        <textarea name="site_contact" rows="4" maxlength="1000">{{.SiteContact}}</textarea>
      </label>
      <label>{{t .Lang "friend_links"}}
        <textarea name="site_friend_links" rows="5" maxlength="3000">{{.FriendLinks}}</textarea>
      </label>
      <label>{{t .Lang "copyright"}}（{{"{{site_title}}"}} / {{"{{year}}"}}）
        <input type="text" name="site_copyright" value="{{.SiteCopyright}}" maxlength="200">
      </label>
      <label>{{t .Lang "privacy_policy"}}
        <textarea name="privacy_policy" rows="10" maxlength="12000">{{.Privacy}}</textarea>
      </label>
      <label>{{t .Lang "terms_service"}}
        <textarea name="terms_of_service" rows="10" maxlength="12000">{{.Terms}}</textarea>
      </label>
      <label>{{t .Lang "turnstile_site_key"}}
        <input type="text" name="turnstile_site_key" value="{{.TurnstileSiteKey}}" maxlength="128">
      </label>
      <label>{{t .Lang "turnstile_secret"}}
        <input type="password" name="turnstile_secret" placeholder="{{if .TurnstileSecretSet}}{{t .Lang "configured_keep"}}{{else}}{{t .Lang "not_configured"}}{{end}}" maxlength="128">
      </label>
      <button class="btn" type="submit">{{t .Lang "save"}}</button>
    </form>
  </article>
</main>
</body>
</html>
{{end}}
