{{define "admin_account"}}
{{template "head" .}}
{{template "admin_nav" .}}
<main class="container narrow">
  <article class="card">
    <h1>{{t .Lang "account_settings"}}</h1>
    {{if .Saved}}<div class="ok">{{t .Lang "save"}}</div>{{end}}
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/account" class="form">
      <label>{{t .Lang "username"}}
        <input type="text" name="username" value="{{.Username}}" required>
      </label>
      <label>{{t .Lang "current_password"}}
        <input type="password" name="current_password" required>
      </label>
      <label>{{t .Lang "new_password"}}
        <input type="password" name="new_password" minlength="8">
      </label>
      <label>{{t .Lang "confirm_new_password"}}
        <input type="password" name="confirm_password" minlength="8">
      </label>
      <button class="btn" type="submit">{{t .Lang "save"}}</button>
    </form>
  </article>
</main>
</body>
</html>
{{end}}
