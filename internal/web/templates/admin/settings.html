{{define "admin_settings"}}
{{template "head" .}}
{{template "admin_nav" .}}
<main class="container narrow">
  <article class="card">
    <h1>{{t .Lang "payment_settings"}}</h1>
    <p class="muted">{{t .Lang "save_effect_now"}}</p>
    {{if .Saved}}<div class="ok">{{t .Lang "save"}}</div>{{end}}
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/settings" class="form">
      <label>{{t .Lang "bepusdt_base_url"}}
        <input type="text" name="bepusdt_base_url" value="{{.BepusdtBaseURL}}" placeholder="https://pay.setup0.de" required>
      </label>
      <label>{{t .Lang "bepusdt_api_token"}}
        <input type="password" name="bepusdt_api_token" placeholder="{{if .BepusdtTokenSet}}{{t .Lang "configured_keep"}}{{else}}{{t .Lang "not_configured"}}{{end}}">
      </label>
      <label>{{t .Lang "fiat"}}
        <input type="text" name="fiat" value="{{.Fiat}}" maxlength="10" required>
      </label>
      <label>{{t .Lang "trade_types"}}
        <textarea name="trade_types" rows="5" required>{{.TradeTypes}}</textarea>
      </label>
      <label>{{t .Lang "payment_timeout"}}
        <input type="number" name="bepusdt_timeout_sec" value="{{.TimeoutSec}}" min="1" required>
      </label>
      <label>{{t .Lang "public_base_url"}}
        <input type="text" name="shop_public_base_url" value="{{.PublicBaseURL}}" placeholder="https://shop.3737.de" required>
      </label>
      <label>{{t .Lang "notify_url"}}
        <input type="text" name="bepusdt_notify_url" value="{{.NotifyURL}}">
      </label>
      <button class="btn" type="submit">{{t .Lang "save"}}</button>
    </form>
  </article>
</main>
</body>
</html>
{{end}}
