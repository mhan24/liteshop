{{define "public_order_lookup"}}
{{template "head" .}}
{{template "public_nav" .}}
<main class="container narrow">
  <a href="/" class="muted">{{t .Lang "back_home"}}</a>
  <article class="card">
    <h1>{{t .Lang "order_query"}}</h1>
    <form method="get" action="/order" class="form">
      <label>{{t .Lang "order_no"}}
        <input type="text" name="order_no" placeholder="S2026..." required>
      </label>
      <label>{{t .Lang "contact_placeholder"}}
        <input type="email" name="contact" maxlength="200" required>
      </label>
      <button class="btn" type="submit">{{t .Lang "query_order"}}</button>
    </form>
  </article>
</main>
{{template "public_footer" .}}
</body>
</html>
{{end}}
